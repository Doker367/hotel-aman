<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aman Resorts — Administration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/hotel-aman/styles/variables.css">
  <link rel="stylesheet" href="/hotel-aman/styles/base.css">
  <link rel="stylesheet" href="/hotel-aman/styles/components.css">
  <link rel="stylesheet" href="/hotel-aman/styles/layout.css">
  <link rel="stylesheet" href="/hotel-aman/styles/pages.css">
  <link rel="stylesheet" href="/hotel-aman/styles/responsive.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>

  <!-- Admin Login -->
  <div class="admin-login" id="adminLogin">
    <div class="admin-login__card">
      <div class="admin-login__logo">AMAN</div>
      <div class="admin-login__subtitle">Administration Portal</div>
      
      <div class="admin-login__error" id="loginError"></div>

      <form class="admin-login__form" id="loginForm">
        <div class="form__group">
          <label class="form__label" for="loginEmail">Email</label>
          <input class="form__input" type="email" id="loginEmail" placeholder="admin@amanresorts.com" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="loginPassword">Password</label>
          <input class="form__input" type="password" id="loginPassword" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn--primary btn--full">
          <span>Sign In</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div class="admin-page" id="adminDashboard" style="display:none;">
    <header class="nav scrolled">
      <div class="nav__container">
        <a href="/hotel-aman/pages/index.html" class="nav__logo">
          <span class="nav__logo-symbol">✦</span>
          <span class="nav__logo-text">AMAN</span>
          <span class="nav__logo-sub">ADMIN</span>
        </a>
        <div class="nav__actions">
          <span id="adminName" style="font-size:0.85rem;color:var(--text-secondary);"></span>
          <button class="nav__cta" id="logoutBtn">Logout</button>
        </div>
      </div>
    </header>

    <div class="container" style="padding-top: 2rem;">
      <div class="admin__header">
        <div>
          <span class="section-tag" style="padding-left:0;">Dashboard</span>
          <h2 class="section-title" style="font-size:2rem;">Welcome Back</h2>
        </div>
        <div style="font-size:0.85rem;color:var(--text-tertiary);" id="dashDate"></div>
      </div>

      <!-- Stats -->
      <div class="admin__stats" id="statsGrid">
        <div class="admin__stat-card">
          <div class="admin__stat-label">Total Bookings</div>
          <div class="admin__stat-value" id="statTotal">-</div>
        </div>
        <div class="admin__stat-card">
          <div class="admin__stat-label">Pending</div>
          <div class="admin__stat-value" id="statPending">-</div>
        </div>
        <div class="admin__stat-card">
          <div class="admin__stat-label">Confirmed</div>
          <div class="admin__stat-value" id="statConfirmed">-</div>
        </div>
        <div class="admin__stat-card">
          <div class="admin__stat-label">Revenue</div>
          <div class="admin__stat-value" id="statRevenue">-</div>
        </div>
        <div class="admin__stat-card">
          <div class="admin__stat-label">Total Rooms</div>
          <div class="admin__stat-value" id="statRooms">-</div>
        </div>
        <div class="admin__stat-card">
          <div class="admin__stat-label">Unread Messages</div>
          <div class="admin__stat-value" id="statMessages">-</div>
        </div>
      </div>

      <!-- Recent Bookings Table -->
      <div class="admin__table-wrapper">
        <div class="admin__table-header">
          <h3>Recent Reservations</h3>
        </div>
        <table class="admin__table">
          <thead>
            <tr>
              <th>Guest</th>
              <th>Suite</th>
              <th>Check-in</th>
              <th>Check-out</th>
              <th>Total</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookingsTable">
            <tr>
              <td colspan="7" style="text-align:center;padding:2rem;color:var(--text-tertiary);">Loading reservations...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <div class="toast__icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <div class="toast__message" id="toastMessage"></div>
  </div>

  <script src="/hotel-aman/js/api.js"></script>
  <script>
    (() => {
      const $ = (sel) => document.querySelector(sel);

      const formatCurrency = (n) =>
        new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(n);

      const formatDate = (d) =>
        new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      // Theme
      const saved = localStorage.getItem('aman_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);

      // Check if already logged in
      const token = localStorage.getItem('aman_token');
      if (token) {
        showDashboard();
      }

      // Login form
      $('#loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = $('#loginEmail').value;
        const password = $('#loginPassword').value;
        const errorEl = $('#loginError');

        try {
          const res = await API.login(email, password);
          localStorage.setItem('aman_token', res.data.token);
          localStorage.setItem('aman_user', JSON.stringify(res.data.user));
          showDashboard();
        } catch (err) {
          errorEl.textContent = err.error || 'Invalid credentials';
          errorEl.classList.add('visible');
        }
      });

      // Logout
      document.addEventListener('click', (e) => {
        if (e.target.id === 'logoutBtn' || e.target.closest('#logoutBtn')) {
          localStorage.removeItem('aman_token');
          localStorage.removeItem('aman_user');
          location.reload();
        }
      });

      async function showDashboard() {
        $('#adminLogin').style.display = 'none';
        $('#adminDashboard').style.display = 'block';

        const user = JSON.parse(localStorage.getItem('aman_user') || '{}');
        $('#adminName').textContent = user.full_name || 'Admin';
        $('#dashDate').textContent = new Date().toLocaleDateString('en-US', {
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        try {
          const [dashRes, bookingsRes] = await Promise.allSettled([
            API.getDashboard(),
            API.getRecentBookings()
          ]);

          if (dashRes.status === 'fulfilled') {
            const d = dashRes.value.data;
            $('#statTotal').textContent = d.bookings.total;
            $('#statPending').textContent = d.bookings.pending;
            $('#statConfirmed').textContent = d.bookings.confirmed;
            $('#statRevenue').textContent = formatCurrency(d.bookings.total_revenue);
            $('#statRooms').textContent = d.rooms.total;
            $('#statMessages').textContent = d.messages.unread;
          }

          if (bookingsRes.status === 'fulfilled') {
            renderBookings(bookingsRes.value.data);
          }
        } catch (err) {
          console.warn('Dashboard data unavailable:', err);
        }
      }

      function renderBookings(bookings) {
        const tbody = $('#bookingsTable');
        if (!bookings || bookings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-tertiary);">No reservations yet</td></tr>';
          return;
        }

        tbody.innerHTML = bookings.map(b => `
          <tr>
            <td>
              <strong style="color:var(--text-primary);">${b.guest_name}</strong><br>
              <span style="font-size:0.8rem;">${b.guest_email}</span>
            </td>
            <td>${b.room_name || '-'}</td>
            <td>${formatDate(b.check_in)}</td>
            <td>${formatDate(b.check_out)}</td>
            <td style="color:var(--text-primary);font-weight:500;">${formatCurrency(b.total_price)}</td>
            <td><span class="status-badge status-badge--${b.status}">${b.status}</span></td>
            <td>
              ${b.status === 'pending' ? `
                <button class="btn btn--ghost" style="padding:0.375rem 0.75rem;font-size:0.7rem;" 
                        onclick="updateStatus('${b.id}', 'confirmed', this)">Confirm</button>
              ` : ''}
            </td>
          </tr>
        `).join('');
      }

      window.updateStatus = async function(id, status, btn) {
        try {
          btn.disabled = true;
          btn.textContent = '...';
          await API.updateBookingStatus(id, status);
          showDashboard(); // Refresh
          showToast(`Booking ${status} successfully`);
        } catch (err) {
          showToast('Failed to update booking');
          btn.disabled = false;
          btn.textContent = 'Confirm';
        }
      };

      function showToast(message) {
        const toast = $('#toast');
        const msg = $('#toastMessage');
        if (!toast || !msg) return;
        msg.textContent = message;
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 4000);
      }
    })();
  </script>

</body>
</html>
